    <script>try{const b=JSON.parse(localStorage.getItem("study-branding-v2")||"null");if(b?.name)document.querySelector(".study-loader__brand").textContent=b.name;if(b?.vars)for(const key of ["--primary","--background","--foreground"])if(b.vars[key])document.documentElement.style.setProperty(key,b.vars[key]);}catch{}</script>
