
name: Deploy MDCAT API to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdcat-api-cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cpanel-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm version
        run: npm install --global npm@10.9.7

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace=@workspace/api-server

      - name: Package API with deployment metadata
        shell: bash
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          export DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const out = 'deploy/api-cpanel';

          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          if (!fs.existsSync('backend/dist/index.mjs')) {
            throw new Error('API build output missing: backend/dist/index.mjs');
          }

          fs.cpSync('backend/dist', `${out}/dist`, {
            recursive: true,
            filter: source => !source.endsWith('.map'),
          });

          if (fs.existsSync('backend/assets')) {
            fs.cpSync('backend/assets', `${out}/assets`, {
              recursive: true,
            });
          }

          const backendPkg = JSON.parse(
            fs.readFileSync('backend/package.json', 'utf8')
          );

          const dependencies = {};

          for (const name of [
            '@napi-rs/canvas',
            'pdfjs-dist',
            'nodemailer',
            'pino',
            'pino-http',
            'pino-pretty',
          ]) {
            const version =
              backendPkg.dependencies?.[name] ??
              backendPkg.devDependencies?.[name];

            if (!version) {
              throw new Error(`Missing API runtime dependency: ${name}`);
            }

            dependencies[name] = version;
          }

          fs.writeFileSync(
            `${out}/package.json`,
            JSON.stringify(
              {
                name: 'mdcat-api-runtime',
                private: true,
                main: 'app.js',
                scripts: {
                  start: 'node app.js',
                },
                engines: {
                  node: '>=22.12.0 <23',
                },
                packageManager: 'npm@10.9.7',
                dependencies,
              },
              null,
              2
            ) + '\n'
          );

          const metadata = {
            DEPLOY_COMMIT: process.env.DEPLOY_COMMIT,
            DEPLOYED_AT: process.env.DEPLOYED_AT,
            DEPLOY_RUN_ID: process.env.DEPLOY_RUN_ID,
          };

          for (const [key, value] of Object.entries(metadata)) {
            if (!value) {
              throw new Error(`Missing deployment metadata: ${key}`);
            }
          }

          const appJs = `
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');

          process.chdir(__dirname);
          process.env.NODE_ENV = process.env.NODE_ENV || 'production';

          ${Object.entries(metadata)
            .map(([key, value]) =>
              `process.env.${key} = ${JSON.stringify(value)};`
            )
            .join('\n')}

          import(pathToFileURL(path.join(__dirname, 'dist/index.mjs')).href)
            .catch(error => {
              console.error('MDCAT API startup failed:', error);
              process.exit(1);
            });
          `;

          fs.writeFileSync(`${out}/app.js`, appJs);

          fs.copyFileSync(
            'hosting.env.example',
            `${out}/.env.example`
          );

          console.log('API package created successfully.');
          console.log('Deployment commit:', metadata.DEPLOY_COMMIT);
          console.log('Deployment time:', metadata.DEPLOYED_AT);
          console.log('Deployment run ID:', metadata.DEPLOY_RUN_ID);
          NODE

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy API over FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_TARGET: ${{ secrets.CPANEL_FTP_TARGET }}
        run: |
          set -euo pipefail

          for v in FTP_SERVER FTP_USER FTP_PASS FTP_TARGET; do
            if [[ -z "${!v}" ]]; then
              echo "Missing GitHub secret: $v"
              exit 1
            fi
          done

          FTP_PORT="${FTP_PORT:-21}"

          lftp -p "$FTP_PORT" \
            -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 30

          mirror -R --parallel=4 --verbose \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob node_modules/ \
            --exclude-glob uploads/ \
            --exclude-glob tmp/ \
            deploy/api-cpanel/ "$FTP_TARGET"

          bye
          EOF

      - name: Restart Passenger app
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_TARGET: ${{ secrets.CPANEL_FTP_TARGET }}
        run: |
          set -euo pipefail

          FTP_PORT="${FTP_PORT:-21}"

          lftp -p "$FTP_PORT" \
            -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 30

          put /dev/null -o "$FTP_TARGET/tmp/restart.txt"

          bye
          EOF
