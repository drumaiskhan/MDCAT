name: Build Student APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Live student website URL
        default: https://mdcatprep.live
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: mkdir -p dist android/app/src/main/assets && echo '<!doctype html><title>MDCAT</title>' > dist/index.html
      - run: npx cap sync android
        env:
          SITE_URL: ${{ inputs.site_url }}
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mdcat-student-apk
          path: student/android/app/build/outputs/apk/debug/app-debug.apk
