name: Test, build and deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload the tested build to cPanel over FTP
        type: boolean
        default: false
      package:
        description: Which package to upload to CPANEL_FTP_TARGET
        type: choice
        options: [api-cpanel, student-hostinger, admin-hostinger]
        default: api-cpanel

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global npm@10.9.7
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix student --no-audit --no-fund
      - run: npm install --prefix admin --no-audit --no-fund
      - run: npm run test:mdcat && npm run test:auth
      - run: npm run build
      - run: npm run package:hosting
        env:
          API_URL: ${{ vars.API_ORIGIN }}
          STUDENT_URL: ${{ vars.STUDENT_ORIGIN }}
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            deploy/student-hostinger/
            deploy/admin-hostinger/
            deploy/api-cpanel/
            deploy/filebridge-cpanel/
            deploy/zips/
            deploy/README.txt

  deploy-ftp:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cpanel-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-build
          path: release
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload over FTPS
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_TARGET: ${{ secrets.CPANEL_FTP_TARGET }}
          PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          for v in FTP_SERVER FTP_USER FTP_PASS FTP_TARGET; do test -n "${!v}" || { echo "Secret for $v is empty"; exit 1; }; done
          src="release/$PACKAGE"
          test -d "$src" || { echo "Missing $src"; exit 1; }
          extra=""
          if [ "$PACKAGE" = "api-cpanel" ]; then
            # Keep server-managed files; never overwrite .env, uploads or node_modules.
            extra="--exclude-glob .env --exclude-glob node_modules/ --exclude-glob uploads/ --exclude-glob tmp/"
          fi
          lftp -p "${FTP_PORT:-21}" -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 30
          mirror -R --parallel=4 --verbose $extra "$src" "$FTP_TARGET"
          bye
          EOF
          if [ "$PACKAGE" = "api-cpanel" ]; then
            mkdir -p /tmp/restart && : > /tmp/restart/restart.txt
            lftp -p "${FTP_PORT:-21}" -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          mkdir -p "$FTP_TARGET/tmp"
          put -O "$FTP_TARGET/tmp" /tmp/restart/restart.txt
          bye
          EOF
          fi
