name: Build and Deploy API to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdcat-api-cpanel-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build API
        run: npm run build --workspace=@workspace/api-server

      - name: Deploy API to cPanel via FTPS
        uses: appleboy/ftp-action@v1.0.0
        with:
          host: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          protocol: ftps
          localDir: backend/
          remoteDir: ${{ secrets.CPANEL_FTP_TARGET }}
          exclude: |
            **/.env
            **/.env.*
            **/node_modules/**
            **/.git/**
            **/uploads/**
            **/tmp/**

      - name: Restart Passenger app
        run: |
          curl --fail --silent --show-error \
            --user "${{ secrets.CPANEL_FTP_USERNAME }}:${{ secrets.CPANEL_FTP_PASSWORD }}" \
            "ftp://${{ secrets.CPANEL_FTP_SERVER }}:${{ secrets.CPANEL_FTP_PORT }}/${{ secrets.CPANEL_FTP_TARGET }}/tmp/restart.txt" \
            --quote "DELE /${{ secrets.CPANEL_FTP_TARGET }}/tmp/restart.txt" || true
